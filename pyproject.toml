[tool.poetry]
name = "gcip2"
version = "0.0.13"
description = "pivlab gcip2"
authors = ["Arsenii Nikulin <a.nikulin@pivlab.space>", "PivLab Tech"]
readme = "README.md"
license = "MIT"

packages = [{ include = "gcip2" }]
include = ["gcip2/py.typed"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "^2.13.4"
jsonschema = "^4.26.0"
pyyaml = "^6.0.3"
click = "^8.4.1"
pre-commit = "^4.6.0"
jinja2 = "^3.1.6"
pytest = "^9.1.1"
pytest-regressions = "^2.11.0"
pytest-cov = "^7.1.0"
gitpython = "^3.1.57"
hvac = "^2.4.0"
loguru = "^0.7.3"
argparse = "^1.4.0"
ruff = "^0.16.1"

[tool.poetry.group.dev.dependencies]
requests = ">=2.34.2,<3.0.0"
types-pyyaml = "^6.0.12.20260724"
types-hvac = "^2.4.0.20260731"
types-jsonschema = "^4.26.0.20260518"

[tool.poetry.scripts]
gcip2 = "gcip2.cli:cli"
gciptask = "gcip2.tasks_core.cli:cli"


[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "*venv*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
