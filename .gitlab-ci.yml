      uv sync --directory "${CI_RUNNER_DIR}"
      venv="$(dirname "$(dirname "$(uv run --directory "${CI_RUNNER_DIR}" which python)")")"
      echo "using venv '${venv}'"
      . "${venv}/bin/activate"
      printf '\e[0Ksection_end:%s\r\e[0K\n' "${section}"
    - echo Do nothing.
  script:
    - pytest -v tests/unit/test_job.py --junitxml=pytest.xml --cov=gcip2.pipeline_core
      --cov-report=term --cov-report=xml:coverage.xml
  stage: unit-tests
  artifacts:
    paths:
      - coverage.xml
      - pytest.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit:
        - pytest.xml
  coverage: /TOTAL.*?(\d+%)$/
  interruptible: true

