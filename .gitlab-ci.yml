initialization/trigger-pipeline:
  variables:
    PARENT_PIPELINE_ID: ${CI_PIPELINE_ID}
    PARENT_PIPELINE_SOURCE: ${CI_PIPELINE_SOURCE}
  stage: jobs
  needs:
    - build-pipeline -f pipelines/initialization/ci.py
  interruptible: false
  trigger:
    strategy: depend
    include:
      - job: build-pipeline -f pipelines/initialization/ci.py
        artifact: out/pipeline.gitlab-ci.yml
    forward:
      yaml_variables: true
      pipeline_variables: true

