unit-tests:job:
  before_script:
    - |
      #!/usr/bin/env sh
      set -o errexit -o nounset -o xtrace
      section="$(date +'%s'):before_script_setup"
      printf '\e[0Ksection_start:%s[collapsed=true]\r\e[0K%s\n' "${section}" "setup"
      # shellcheck disable=SC2086
      poetry install
      . ".venv/bin/activate"
      printf '\e[0Ksection_end:%s\r\e[0K\n' "${section}"
  after_script:
    - |
      #!/usr/bin/env sh
      set -o errexit -o nounset -o xtrace
      section="$(date +'%s'):after_script_setup"
      printf '\e[0Ksection_start:%s[collapsed=true]\r\e[0K%s\n' "${section}" "setup"
      # shellcheck disable=SC2086
      poetry install
      . ".venv/bin/activate"
      printf '\e[0Ksection_end:%s\r\e[0K\n' "${section}"
    - echo Do nothing.
  script:
    - pytest -v tests/unit/test_job.py --junitxml=pytest.xml --cov=gcip2 --cov-report=term
      --cov-report=xml:coverage.xml
  stage: unit-tests
  artifacts:
    paths:
      - coverage.xml
      - pytest.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit:
        - pytest.xml
  coverage: /TOTAL.*?(\d+%)$/
  interruptible: true

