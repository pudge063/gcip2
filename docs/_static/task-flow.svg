<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8ea0"/>
    </marker>
    <style>
      .box   { fill: none; stroke: #7d8ea0; stroke-width: 1.4; rx: 6; }
      .accent{ stroke: #3d7dca; }
      .lbl   { fill: #5c6b7a; font-size: 14px; }
      .lblb  { fill: #5c6b7a; font-size: 14px; font-weight: 600; }
      .mono  { fill: #3d7dca; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .note  { fill: #8a97a4; font-size: 12px; }
      .line  { stroke: #7d8ea0; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dash  { stroke: #b0bcc7; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- CLI -->
  <rect class="box accent" x="250" y="14" width="280" height="46"/>
  <text class="mono" x="390" y="34" text-anchor="middle">dothat run build-gitlab-ci</text>
  <text class="note" x="390" y="51" text-anchor="middle">command line or GitLab CI job</text>
  <line class="line" x1="390" y1="60" x2="390" y2="86"/>

  <!-- Container -->
  <rect class="box" x="250" y="88" width="280" height="46"/>
  <text class="lblb" x="390" y="108" text-anchor="middle">Container</text>
  <text class="note" x="390" y="124" text-anchor="middle">built once from --config</text>
  <text class="note" x="548" y="115">supplies ProjectConfig</text>
  <text class="note" x="548" y="130">and shared services</text>
  <line class="line" x1="390" y1="134" x2="390" y2="160"/>

  <!-- Registry -->
  <rect class="box" x="250" y="162" width="280" height="46"/>
  <text class="lblb" x="390" y="182" text-anchor="middle">Task registry</text>
  <text class="note" x="390" y="198" text-anchor="middle">built-in tasks + project module</text>
  <line class="line" x1="390" y1="208" x2="390" y2="234"/>

  <!-- Task -->
  <rect class="box accent" x="250" y="236" width="280" height="62"/>
  <text class="lblb" x="390" y="258" text-anchor="middle">Task</text>
  <text class="note" x="390" y="276" text-anchor="middle">name · parameters · actions</text>
  <text class="note" x="390" y="291" text-anchor="middle">declares the workflow, runs nothing</text>

  <!-- Parameter sources -->
  <rect class="box" x="14" y="228" width="196" height="78"/>
  <text class="lblb" x="112" y="250" text-anchor="middle">Parameter sources</text>
  <text class="note" x="112" y="269" text-anchor="middle">defaults</text>
  <text class="note" x="112" y="284" text-anchor="middle">environment · configuration</text>
  <text class="note" x="112" y="299" text-anchor="middle">CLI arguments</text>
  <line class="dash" x1="210" y1="267" x2="246" y2="267"/>

  <line class="line" x1="390" y1="298" x2="390" y2="336"/>
  <text class="note" x="400" y="322">executed in order</text>

  <!-- Actions -->
  <rect class="box" x="126" y="338" width="150" height="46"/>
  <text class="lbl" x="201" y="366" text-anchor="middle">Action 1</text>

  <rect class="box" x="315" y="338" width="150" height="46"/>
  <text class="lbl" x="390" y="366" text-anchor="middle">Action 2</text>

  <rect class="box" x="504" y="338" width="150" height="46"/>
  <text class="lbl" x="579" y="366" text-anchor="middle">Action 3</text>

  <line class="line" x1="276" y1="361" x2="311" y2="361"/>
  <line class="line" x1="465" y1="361" x2="500" y2="361"/>

  <path class="line" d="M 390 336 L 390 326 L 201 326 L 201 334"/>
  <path class="line" d="M 390 336 L 390 326 L 579 326 L 579 334"/>

  <!-- Outcome -->
  <line class="line" x1="390" y1="384" x2="390" y2="412"/>
  <rect class="box" x="250" y="414" width="280" height="42"/>
  <text class="lbl" x="390" y="440" text-anchor="middle">shell command · file · API call</text>
</svg>
