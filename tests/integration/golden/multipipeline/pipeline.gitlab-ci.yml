workflow:
  name: default
  auto_cancel:
    on_job_failure: none
    on_new_commit: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_TAG =~ '/^v\d+\.\d+\.\d+$/'
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

stages:
  - jobs

default:
  image:
    name: ghcr.io/astral-sh/uv:python3.12-bookworm
  tags:
    - static-k8s

matrix-job:
  before_script:
    - |
      #!/usr/bin/env sh
      set -o errexit -o nounset -o xtrace
      section="$(date +'%s'):before_script_setup"
      printf '\e[0Ksection_start:%s[collapsed=true]\r\e[0K%s\n' "${section}" "setup"
      CI_RUNNER_DIR="$(readlink -f "${CI_RUNNER_DIR:-.}")"
      export CI_RUNNER_DIR
      export UV_LINK_MODE=copy
      uv sync --directory "${CI_RUNNER_DIR}"
      venv="$(dirname "$(dirname "$(uv run --directory "${CI_RUNNER_DIR}" which python)")")"
      echo "using venv '${venv}'"
      . "${venv}/bin/activate"
      printf '\e[0Ksection_end:%s\r\e[0K\n' "${section}"
  after_script:
    - |
      #!/usr/bin/env sh
      set -o errexit -o nounset -o xtrace
      section="$(date +'%s'):after_script_setup"
      printf '\e[0Ksection_start:%s[collapsed=true]\r\e[0K%s\n' "${section}" "setup"
      CI_RUNNER_DIR="$(readlink -f "${CI_RUNNER_DIR:-.}")"
      export CI_RUNNER_DIR
      export UV_LINK_MODE=copy
      uv sync --directory "${CI_RUNNER_DIR}"
      venv="$(dirname "$(dirname "$(uv run --directory "${CI_RUNNER_DIR}" which python)")")"
      echo "using venv '${venv}'"
      . "${venv}/bin/activate"
      printf '\e[0Ksection_end:%s\r\e[0K\n' "${section}"
    - echo Do nothing.
  script:
    - echo $TEST
  stage: jobs
  parallel:
    matrix:
      - TEST:
          - '1'
          - '2'
          - '3'
  interruptible: true
