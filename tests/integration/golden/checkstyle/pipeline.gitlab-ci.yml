workflow:
  name: default
  auto_cancel:
    on_job_failure: none
    on_new_commit: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_TAG =~ '/^v\d+\.\d+\.\d+$/'
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

stages:
  - pre-commit

default:
  image:
    name: pfeiffermax/python-poetry:1.17.0-poetry2.2.1-python3.12.12-trixie
  tags:
    - static-k8s

pre-commit:
  before_script:
    - |
      #!/usr/bin/env sh
      set -o errexit -o nounset -o xtrace
      section="$(date +'%s'):before_script_setup"
      printf '\e[0Ksection_start:%s[collapsed=true]\r\e[0K%s\n' "${section}" "setup"
      # shellcheck disable=SC2086
      poetry install
      . ".venv/bin/activate"
      printf '\e[0Ksection_end:%s\r\e[0K\n' "${section}"
  after_script:
    - |
      #!/usr/bin/env sh
      set -o errexit -o nounset -o xtrace
      section="$(date +'%s'):after_script_setup"
      printf '\e[0Ksection_start:%s[collapsed=true]\r\e[0K%s\n' "${section}" "setup"
      # shellcheck disable=SC2086
      poetry install
      . ".venv/bin/activate"
      printf '\e[0Ksection_end:%s\r\e[0K\n' "${section}"
    - echo Do nothing.
  script:
    - ls -la
    - pre-commit run -av
  stage: pre-commit
  interruptible: true
