[extra]
version = "0.1.0"
test_repo = "git@gl.pivlab.space:sandbox/gcip2-test-pipeline.git"

[extra.tasks]
module = "_tasks"

[extra.targets.test-1]
param1 = "1"

[extra.targets.test-2]
param1 = "2"


[extra.secrets.vault.vault-with-approle]
url = "https://vault.pivlab.space"
auth_method = "approle"
app_role_id_env_var = "APP_ROLE_ID"
app_role_secret_id_env_var = "APP_ROLE_SECRET_ID"
mount_point = "rnd"
path = "infra/test"

[extra.secrets.vault.vault-with-jwks]
url = "https://vault.pivlab.space"
auth_method = "jwks"
mount_point = "rnd"
path = "infra/test"

[extra.secrets.vault.pypi-token]
url = "https://vault.pivlab.space"
auth_method = "approle"
app_role_id_env_var = "APP_ROLE_ID"
app_role_secret_id_env_var = "APP_ROLE_SECRET_ID"
mount_point = "rnd"
path = "infra/pypi"

[extra.secrets.vault.gitlab-token]
url = "https://vault.pivlab.space"
auth_method = "approle"
app_role_id_env_var = "APP_ROLE_ID"
app_role_secret_id_env_var = "APP_ROLE_SECRET_ID"
mount_point = "rnd"
path = "infra/accounts/gitlab/ci"

[extra.secrets.vault.gl-pivlab-ssh]
url = "https://vault.pivlab.space"
auth_method = "approle"
app_role_id_env_var = "APP_ROLE_ID"
app_role_secret_id_env_var = "APP_ROLE_SECRET_ID"
mount_point = "rnd"
path = "infra/accounts/gitlab/ci"